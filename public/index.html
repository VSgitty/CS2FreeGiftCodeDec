<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftDectector - Free Codes Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <div>
          <p class="eyebrow">CS Skin Monitor</p>
          <h1>Neue Free Codes auf einen Blick</h1>
          <p class="subtitle">
            Erfasst automatisch Free-Code-Posts von Instagram, Facebook, Twitter/X und weiteren Quellen.
            Keine manuellen Durchklicks mehr.
          </p>
        </div>
        <div class="actions">
          <button id="scanBtn" class="btn-primary">Jetzt neu scannen</button>
          <label class="toggle">
            <input id="onlyCodes" type="checkbox" />
            Nur Einträge mit erkanntem Code
          </label>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="toolbar">
        <input id="search" type="search" placeholder="Nach Code, Quelle, Text filtern..." />
        <div class="filter-group">
          <label>
            <input type="checkbox" class="source-filter" data-source="instagram" checked />
            Instagram
          </label>
          <label>
            <input type="checkbox" class="source-filter" data-source="facebook" checked />
            Facebook
          </label>
          <label>
            <input type="checkbox" class="source-filter" data-source="twitter" checked />
            Twitter/X
          </label>
        </div>
      </section>

      <section id="items" class="grid"></section>
      
      <div id="noItems" class="no-items" style="display: none;">
        <p>Keine Posts gefunden</p>
      </div>
    </main>

    <template id="itemTpl">
      <article class="card">
        <div class="metaRow">
          <span class="source-badge"></span>
          <span class="date"></span>
        </div>
        <h3 class="title"></h3>
        <p class="text"></p>
        <div class="codes-container">
          <div class="codes"></div>
        </div>
        <a class="link" target="_blank" rel="noopener noreferrer">Zum Post →</a>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
